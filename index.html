
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ФФ — личный кабинет</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5f9;color:#192d45;font-family:Arial,sans-serif}
header{background:#142b45;color:white;padding:20px}
.brand{font-size:23px;font-weight:bold}
.brand span{font-size:13px;color:#bdcada;display:block;margin-top:5px}
main{max-width:1000px;margin:30px auto;padding:0 18px}
h1{font-size:26px;margin-bottom:8px}
.muted{color:#77869a;font-size:14px}
.panel{background:white;border:1px solid #e5eaf0;border-radius:13px;padding:20px;margin-top:20px}
input{width:100%;padding:13px;border:1px solid #dce3ec;border-radius:8px;font-size:15px;margin:8px 0}
button{background:#2764d8;color:white;border:0;border-radius:8px;padding:13px 20px;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #edf0f4;font-size:14px}
th{color:#718096;font-size:12px}
.right{text-align:right}
.qty{font-weight:bold}
.note{font-size:12px;color:#8995a5;margin-top:18px}
.status{font-size:13px;margin-top:12px;color:#c33}
@media(max-width:600px){main{margin:20px auto}th,td{font-size:12px;padding:11px 5px}}
</style>
</head>
<body>

<header>
 <div class="brand">ФФ
  <span>Личный кабинет клиента</span>
 </div>
</header>

<main>

<section id="login" class="panel">
 <h1>Вход в личный кабинет</h1>
 <p class="muted">Введите свои данные для доступа к остаткам</p>
 <input id="username" placeholder="Логин" autocomplete="username">
 <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
 <button id="loginButton" onclick="login()">Войти</button>
 <p id="error" class="status"></p>
</section>

<section id="cabinet" class="hidden">
 <h1>Мои остатки</h1>
 <p class="muted">Клиент: <b>ИП Дронова Е.В.</b></p>

 <div class="panel">
  <p class="muted">Ваш склад</p>
  <b id="warehouse">Загрузка...</b>
  <p class="muted" id="stockCount"></p>
  <p class="muted" id="updated"></p>
 </div>

 <div class="panel">
  <input id="search" placeholder="Поиск по названию или артикулу" oninput="showProducts()">
  <div style="overflow-x:auto">
   <table>
    <thead>
     <tr>
      <th>Товар</th>
      <th>Артикул</th>
      <th class="right">Остаток</th>
      <th class="right">Резерв</th>
      <th class="right">В пути</th>
     </tr>
    </thead>
    <tbody id="products"></tbody>
   </table>
  </div>
  <p id="empty" class="muted hidden">Товары не найдены</p>
  <p id="loadError" class="status"></p>
 </div>

 <button onclick="refreshStock()">Обновить остатки</button>
 <button onclick="logout()" style="background:#68788c">Выйти</button>
</section>

</main>

<script>
const API_URL = "https://q-log-server.onrender.com";

let items = [];
let authHeader = "";

async function login(){
 const username = document.getElementById("username").value.trim();
 const password = document.getElementById("password").value;
 const error = document.getElementById("error");
 const button = document.getElementById("loginButton");

 error.textContent = "";

 if(!username || !password){
  error.textContent = "Введите логин и пароль";
  return;
 }

 authHeader = "Basic " + btoa(unescape(encodeURIComponent(username + ":" + password)));
 button.disabled = true;
 button.textContent = "Проверка...";

 try{
  await loadStock();

  document.getElementById("login").classList.add("hidden");
  document.getElementById("cabinet").classList.remove("hidden");
  document.getElementById("password").value = "";
 }catch(e){
  authHeader = "";
  error.textContent = e.message;
 }finally{
  button.disabled = false;
  button.textContent = "Войти";
 }
}

async function loadStock(){
 const response = await fetch(API_URL + "/api/stock", {
  method: "GET",
  headers: {
   "Authorization": authHeader
  }
 });

 if(response.status === 401){
  throw new Error("Неверный логин или пароль");
 }

 if(!response.ok){
  throw new Error("Ошибка получения остатков. Код: " + response.status);
 }

 const data = await response.json();

 items = data.items || [];

 document.getElementById("warehouse").textContent = data.warehouse || "Ваш склад";
 document.getElementById("stockCount").textContent = "Позиций: " + items.length;
 document.getElementById("updated").textContent = "Обновлено: " + new Date().toLocaleString("ru-RU");

 showProducts();
}

function showProducts(){
 const q = document.getElementById("search").value.toLowerCase();

 const filtered = items.filter(x =>
  ((x.product || "") + " " + (x.article || "")).toLowerCase().includes(q)
 );

 document.getElementById("products").innerHTML = filtered.map(x => `
  <tr>
   <td>${escapeHTML(x.product)}</td>
   <td>${escapeHTML(x.article)}</td>
   <td class="right qty">${Number(x.stock || 0)} шт.</td>
   <td class="right">${Number(x.reserve || 0)} шт.</td>
   <td class="right">${Number(x.inTransit || 0)} шт.</td>
  </tr>
 `).join("");

 document.getElementById("empty").classList.toggle("hidden", filtered.length !== 0);
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

async function refreshStock(){
 const error = document.getElementById("loadError");
 error.textContent = "";

 try{
  await loadStock();
 }catch(e){
  error.textContent = e.message;
 }
}

function logout(){
 authHeader = "";
 items = [];
 document.getElementById("cabinet").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("username").value = "";
 document.getElementById("password").value = "";
 document.getElementById("search").value = "";
 document.getElementById("products").innerHTML = "";
}
</script>

</body>
</html>
